[project]
name = "local-ai-tools"
version = "0.1.0"
description = "Local AI tools daemon and stdin-first CLI"
requires-python = ">=3.12"
dependencies = [
  "torch",
  "transformers<5",
  "sentencepiece",
  "protobuf",
]

[project.scripts]
local-ai-tools = "local_ai_tools.cli:main"

[dependency-groups]
dev = [
  "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
