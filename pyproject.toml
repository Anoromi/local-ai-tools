[project]
name = "kokoro-rocm"
version = "0.1.0"
description = "Local Kokoro PyTorch ROCm daemon and stdin-first CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
kokoro-rocm = "kokoro_rocm.cli:main"

[dependency-groups]
dev = [
  "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
